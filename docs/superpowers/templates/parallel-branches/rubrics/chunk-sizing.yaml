# chunk-sizing.yaml — data-driven decomposition rubric (v2 — floor-aware).
#
# Walked by schema_cli.BucketWalker. Input: a signals dict computed from
# the unscored master plan. Output: a recommended bucket + confidence +
# rationale.
#
# v2 changes (per CHUNKING_FLOOR.md):
#   - NEW bucket PARENT_DOES_IT (≤3 items, cheap — don't dispatch at all)
#   - NEW bucket ONE_SUBAGENT  (4-6 items — one dispatch, no decomposition)
#   - GRID buckets now floor-aware: chunk_count = ceil(items / 3)
#   - NEW bucket POOL — queue-picker for >30 items
#   - Token budgets DROPPED (D3 from DISCIPLINES.md) — signals are now
#     line-count + item-count based, never token-based.
#
# Floor discipline (D2): 2-3 items per subagent. Below floor = setup
# waste. Above floor = cap breach risk.
# Line discipline (D3): work-order YAML ≤150 lines target, ≤200 hard cap.
#
# Signals (caller pre-computes):
#   total_items                int    — number of leaf TDD items
#   per_item_lines             int    — estimated lines per item entry in YAML (~45 typical)
#   agent_slots_available      int    — concurrent agent slots available
#   tiers_used                 int    — distinct priority tiers
#   projects_count             int    — distinct repos touched
#   compounding_wins_possible  bool   — earlier work makes later cheaper
#   prefer_sequential          bool   — true when few slots OR ordered shipping desired
#
# First-match wins. Rule order: parent-does-it → 1 subagent → chained →
#   grid (floor-aware) → pool.

version: 2

rules:
  # ──────────────────────────────────────────────────────────────────
  # 1. PARENT_DOES_IT — too small to delegate
  #    Setup cost > work cost; parent has shared skills/exemplars.
  #    → NO plan.yaml, NO chunks, NO fragments. Just do the work.
  # ──────────────────────────────────────────────────────────────────
  - bucket: PARENT_DOES_IT
    require_all:
      - {signal: total_items,    op: "<=", value: 3}
      - {signal: per_item_lines, op: "<=", value: 60}

  # ──────────────────────────────────────────────────────────────────
  # 2. ONE_SUBAGENT — single dispatch, no decomposition
  #    Work needs isolation (worktree) but fits in one subagent.
  #    → 1 chunk, 1 Agent() call. No pool, no waves, no merge ritual.
  # ──────────────────────────────────────────────────────────────────
  - bucket: ONE_SUBAGENT
    require_all:
      - {signal: total_items, op: ">=", value: 4}
      - {signal: total_items, op: "<=", value: 6}

  # ──────────────────────────────────────────────────────────────────
  # 3. TIER_CHAIN — token-frugal + few slots + compounding wins
  #    Sequential, one tier-agent per link; auto-handoff for big tiers.
  # ──────────────────────────────────────────────────────────────────
  - bucket: TIER_CHAIN
    require_all:
      - {signal: tiers_used,            op: ">=", value: 2}
      - {signal: agent_slots_available, op: "<=", value: 4}
      - {signal: prefer_sequential,     op: "==", value: true}

  - bucket: TIER_CHAIN
    require_all:
      - {signal: tiers_used,                op: ">=", value: 3}
      - {signal: compounding_wins_possible, op: "==", value: true}
      - {signal: agent_slots_available,     op: "<=", value: 6}

  # ──────────────────────────────────────────────────────────────────
  # 4. GRID — floor-aware decomposition
  #    chunk_count = ceil(total_items / 3)
  #    Floor: 2-3 items per chunk; never less.
  # ──────────────────────────────────────────────────────────────────
  - bucket: GRID
    # 7-30 items + ≥3 slots → grid with floor-sized chunks
    require_all:
      - {signal: total_items,           op: ">=", value: 7}
      - {signal: total_items,           op: "<=", value: 30}
      - {signal: agent_slots_available, op: ">=", value: 3}

  # ──────────────────────────────────────────────────────────────────
  # 5. POOL — queue-picker for many items
  #    Parent dispenses; N workers × 2-3 items per session.
  # ──────────────────────────────────────────────────────────────────
  - bucket: POOL
    require_all:
      - {signal: total_items, op: ">", value: 30}

  # ──────────────────────────────────────────────────────────────────
  # 6. GRID fallback when slots constrained
  # ──────────────────────────────────────────────────────────────────
  - bucket: GRID
    require_all:
      - {signal: total_items,           op: ">=", value: 7}
      - {signal: total_items,           op: "<=", value: 30}
      - {signal: agent_slots_available, op: ">=", value: 1}

confidence_threshold: 0.85
fallback: NEEDS_AGENT

# ──────────────────────────────────────────────────────────────────
# Bucket → derived sizing (for the operator / dispatcher to compute):
#
#   PARENT_DOES_IT  → no dispatch. Parent works directly.
#   ONE_SUBAGENT    → 1 chunk, all items.
#   TIER_CHAIN      → N tier-agents (sequential); one per priority tier.
#   GRID            → chunk_count = ceil(total_items / 3); 2-3 items each.
#   POOL            → pool_size = 5 workers; items_per_worker = 3.
#
# The chunk_count / pool_size is COMPUTED from the bucket + total_items;
# the rubric returns the SHAPE not the numbers. Operator runs:
#   chunk_count = ceil(total_items / 3)  # for GRID/POOL buckets
# ──────────────────────────────────────────────────────────────────
