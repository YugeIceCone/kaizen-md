# merge.yaml — referenced by plan.yaml::merge.
# Validates against master-plan.schema.json#/$defs/merge.

run_by: "parent"
budget_tokens: 22000

actions:
  # 1. Consolidate fragment files into canonical state
  - "consolidate_perms"
  - "append_progress"
  - "dispatch_backlog"
  - "wire_mcp_mounts"

  # 2. Plan-level ledger + checklist (operator dashboard)
  - "render_master_ledger"    # concat .chunks/*/ledger.jsonl + ledger/<id>.jsonl → ledger/MASTER.jsonl
  - "render_checklist"        # walk chunks/*.yaml + ledger/MASTER.jsonl → CHECKLIST.md

  # 3. Deferred work (possible now that all branches' outputs coexist)
  - action: "retrofit"
    targets:
      - "md_whitespace"
      - "md_dupes"
      - "md_heading_depth"
      - "todo_inventory"
      - "unused_env"
  - action: "cross_pollinate"
    to_project: "~/workspace/semantic-search"
    axes:
      - "fn-name-quality"
      - "validator-wiring"
      - "trace-bloat-join"

  # 4. Cleanup + commit + verify
  - "cleanup_fragments"       # rm -rf .chunks/ (ledger/ persists at the plan level)
  - "merge_commit"
  - "final_verify"

  # 5. Final checklist refresh — reflects retrofit + cross-pollination + final state
  - "render_checklist"
