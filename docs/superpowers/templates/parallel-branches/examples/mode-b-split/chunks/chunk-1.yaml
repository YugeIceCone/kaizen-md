# One chunk per file (Mode B). Validates against chunk.schema.json.
# Editable / dispatchable / templatable independently of sibling chunks.

id: "chunk-1"
title: "Foundation AST — naming + iron-law"
purpose: "2 small AST audits — fn-name verb-match + iron-law-per-feature rollup"
project: "kaizen-md"
deps: []
subagent: "kaizen-implementer"
isolation: "worktree"
worktree_branch: "chunk-1-ast-naming"
max_lines:     150        # D3 default; this file is currently ~84 lines (2 items at floor)
items_count:   2          # D2 floor: 2-3 items per chunk
design_heavy:  false      # set true for legitimately-1-item chunks

owns:
  scripts:
    - "plugins/kaizen/skills/workflow/scripts/fn_name_quality.py"
    - "plugins/kaizen/skills/workflow/scripts/iron_law_per_feature.py"
  tests:
    - "plugins/kaizen/tests/test_fn_name_quality.py"
    - "plugins/kaizen/tests/test_iron_law_per_feature.py"
  bins:
    - "plugins/kaizen/bin/kaizen-fn-name-quality"
    - "plugins/kaizen/bin/kaizen-iron-law-per-feature"
  fragment_dir: ".chunks/1/"

fragments:
  - "perms.json"
  - "progress.md"

guide:
  working_dir: "/home/cherry86/workspace/kaizen-md"
  skills_to_load:
    - "kaizen:tdd"
    - "kaizen:plugin-development"
  exemplar_files:
    - "plugins/kaizen/skills/workflow/scripts/class_name_quality.py"
  conventions:
    - "_envelope.emitter is the output emitter"
    - "scan_text(source, *, path) pure-fn for AST scans"
    - "report + gaps subcommands; gaps exits 1 on violations"
    - "NEVER name a script test_*.py (shadows unittest discovery)"
  upstream_decisions:
    - "30 axes already shipped in master — build on top, don't re-do"
  do_not_touch:
    - "Vendored skills under plugins/kaizen/skills/{coding-skills,superpowers,remember}/"
    - "gateway.py::SUBSERVERS (chunk 8 owns MCP mounting)"

tasks:
  - id: "1.A"
    brainstorm_ref: "10"
    description: "AST: function names start with verb"
    red_test_snippet: |
      def test_get_user_starts_with_verb(self):
          findings = fn_name_quality.scan_text("def get_user(): pass\n", path="ok.py")
          self.assertEqual(findings, [])

      def test_user_data_missing_verb(self):
          findings = fn_name_quality.scan_text("def user_data(): pass\n", path="bad.py")
          self.assertEqual(findings[0]["rule"], "no-leading-verb")
    green_outline: |
      AST walk top-level FunctionDefs; split name on `_`; first part
      must be in known-verb list (get/set/build/parse/load/save/run/
      scan/find/...). Flag missing-verb names.
    commit_message: "feat(fn-name-quality): AST verb-vs-name check (chunk 1 item A)"

  - id: "1.B"
    brainstorm_ref: "47"
    description: "rollup iron-law findings grouped by owning feature dir"
    red_test_snippet: |
      def test_rollup_by_feature_dir(self):
          findings = [
              {"path": "skills/brainstorming/SKILL.md", "rule_id": "x", "severity": "warn"},
              {"path": "skills/workflow/scripts/foo.py", "rule_id": "x", "severity": "warn"},
          ]
          rollup = iron_law_per_feature.rollup_by_feature(findings)
          self.assertEqual(rollup["brainstorming"]["total"], 1)
          self.assertEqual(rollup["workflow"]["total"], 1)
    green_outline: |
      Pure fn rollup_by_feature(findings: list[dict]) -> dict[str, dict].
      Key by path.split('/')[1] (feature dir under skills/).
      Aggregate {total, by_severity, by_rule}. CLI subcommand `report`
      shells out to kaizen-iron-laws check --json, feeds to rollup,
      emits envelope.
    commit_message: "feat(iron-law-per-feature): rollup findings by feature (chunk 1 item B)"
