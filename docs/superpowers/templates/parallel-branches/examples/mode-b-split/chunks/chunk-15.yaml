# Cross-repo chunk — different project, no worktree, no .chunks/ fragments
# (writes happen directly in semantic-search; MERGE doesn't consolidate).

id: "chunk-15"
title: "Cross-repo audit using the 30 pre-existing axes"
purpose: "Wire 30 already-shipped kaizen-* axes into semantic-search verify_cmd + file findings"
project: "semantic-search"
deps: []
subagent: "general-purpose"
isolation: "none"
budget_tokens: 24000

owns:
  scripts: []
  tests: []
  bins: []
  fragment_dir: ".chunks/15/"      # required-by-schema even when unused; populated as empty placeholder
  other:
    - "~/workspace/semantic-search/.kaizen.toml"
    - "~/workspace/semantic-search/scripts/coverage-gate.sh"
    - "~/workspace/semantic-search/docs/2026-05-18-coverage-findings.md"

# No fragments — cross-repo chunk doesn't feed the kaizen-md MERGE step
fragments: []

guide:
  working_dir: "/home/cherry86/workspace/semantic-search"
  skills_to_load: []
  exemplar_files:
    - "~/workspace/kaizen-md/docs/superpowers/plans/2026-05-18-coverage-loop-implemented.md"
  conventions:
    - "Don't modify semantic-search source files (audit, don't fix)"
    - "kaizen-md is read-only here"
    - "Use kaizen backlog add CLI (not raw JSON edits)"

tasks:
  - id: "15.A"
    description: "Verify bin/kaizen-* on PATH from semantic-search cwd"
    commit_message: "(verification — no commit)"

  - id: "15.B"
    description: "Run 30 pre-existing axes; write findings doc"
    commit_message: "docs(coverage): per-axis findings rollup (chunk 15 item B)"

  - id: "15.C"
    description: "File top-10 findings as semantic-search backlog"
    commit_message: "chore(backlog): file 10 coverage findings (chunk 15 item C)"

  - id: "15.D"
    description: "Wire 3 axes (perm-coverage + bin-coverage + heavy-imports) into verify_cmd"
    commit_message: "feat(gate): 3-gate coverage gate (chunk 15 item D)"

  - id: "15.E"
    description: "close-out commit refs kaizen-md plan path"
    commit_message: "chore(chunk-15): close-out (Refs: kaizen-md::dynamic-chunks::chunk-15)"
