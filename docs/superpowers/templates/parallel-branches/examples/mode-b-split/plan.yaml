# Mode B — split-file master plan (thin manifest).
# The chunks: glob resolves to chunks/*.yaml (each validated against chunk.schema.json).
# The merge: path points at merge.yaml.
#
# After loader normalization (_plan_loader.py), this is equivalent to the
# Mode A monolithic form at ../master-plan.example.yaml.
#
# Validate (after loader normalization):
#   python3 -c "
#   import json, yaml, jsonschema, sys
#   sys.path.insert(0, 'plugins/kaizen/skills/workflow/scripts')
#   # from _plan_loader import load_plan  # once landed
#   # plan = load_plan('plan.yaml')
#   # schema = json.load(open('../../schemas/master-plan.schema.json'))
#   # jsonschema.validate(plan, schema)
#   print('valid')
#   "

version: 1
date: "2026-05-18"
scope: "Drain remaining tier-1/2/3 coverage-axes + axis-runner + cross-repo wiring"
projects:
  - "~/workspace/kaizen-md"
  - "~/workspace/semantic-search"
source: "~/workspace/semantic-search/docs/2026-05-17-coverage-ideas.jsonl"
concurrency_mode: "full_parallel"
verification_cadence: "per_chunk"
rubric: "../../rubrics/chunk-sizing.yaml"

# Mode B — glob resolved relative to plan.yaml. Each matched file is
# loaded + validated against chunk.schema.json by the loader.
chunks: "./chunks/*.yaml"

# Mode B — merge config in a separate file.
merge: "./merge.yaml"
