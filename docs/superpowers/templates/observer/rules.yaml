# Custom-observer seed rules — copy to ~/.claude/.kaizen/observer/rules.yaml
# on first install. Phase 2 of the observer build (per the design spec at
# docs/superpowers/specs/2026-05-18-custom-observer-design.md) wires C3
# (the rule engine) to load this file from disk on EVERY evaluation —
# no caching, drift-resilient.
#
# Validated against: rule.schema.json (sibling file).

version: 1

rules:
  # ─────────────────────────────────────────────────────────────────
  # CACHE-DRIFT guard — the canonical bug this observer exists to catch.
  # Fired when a subagent is dispatched with a tool list that differs
  # from the current on-disk agent definition (the kaizen-implementer
  # Bash blocker from 2026-05-18 / commit 9b29d3d would trigger this).
  # ─────────────────────────────────────────────────────────────────
  - id: cache-drift-detect
    description: Subagent dispatched with stale cached tools list
    when:
      event_kind: subagent_dispatch
    match_meta:
      cached_tools_hash_mismatch: true
    verdict: warn
    reason: "Subagent's pinned tool list differs from on-disk agent definition — session restart required for fix to take effect (see fix 9b29d3d for the canonical instance)"

  # ─────────────────────────────────────────────────────────────────
  # DESTRUCTIVE-OP guard — subagents must never invoke these patterns
  # even if their disallowedTools list somehow let one through.
  # ─────────────────────────────────────────────────────────────────
  - id: no-subagent-bash-destructive
    description: Subagent attempted a destructive shell op
    when:
      event_kind: pre_tool_use
      source: subagent
      tool: Bash
    match_params:
      command_regex: '\b(git\s+(push|reset|checkout|merge|rebase|clean|branch\s+-D|remote)|rm\s+-rf|rmdir)'
    verdict: warn
    reason: "Subagent attempted destructive op — its disallowedTools should have blocked, investigate the gap"

  # ─────────────────────────────────────────────────────────────────
  # MCP retry-storm guard — flag if the parent agent loops on MCP calls
  # ─────────────────────────────────────────────────────────────────
  - id: master-mcp-tool-call-density
    description: Main agent invoked >20 MCP tools in <60s
    when:
      event_kind: mcp_tool_call
      source: parent
    aggregate:
      window_seconds: 60
      count_gt: 20
    verdict: warn
    reason: "Possible MCP loop / unintended retry storm"

  # ─────────────────────────────────────────────────────────────────
  # COMMAND-AFTER-ERROR — log when the user dispatches a slash command
  # within 5 seconds of a tool error (likely error-recovery flow worth
  # mining for UX improvements).
  # ─────────────────────────────────────────────────────────────────
  - id: command-after-error
    description: Slash command dispatched immediately after a tool error
    when:
      event_kind: slash_command
    requires_prior:
      event_kind: post_tool_use
      result_summary_regex: 'error|failed|exception|Traceback'
      within_seconds: 5
    verdict: info
    reason: "User likely recovering from error — log for UX pattern mining"

  # ─────────────────────────────────────────────────────────────────
  # SCHEMA-DRIFT meta-rule — fire on any event with drift_anomaly set.
  # ─────────────────────────────────────────────────────────────────
  - id: schema-drift-detected
    description: An event didn't match the current event.schema.json cleanly
    when:
      event_kind: pre_tool_use
    match_meta:
      drift_anomaly_present: true
    verdict: warn
    reason: "Tool emitted an event shape the schema doesn't recognize — schema likely needs an additive update"

  # ─────────────────────────────────────────────────────────────────
  # HOOK-SILENCE detection — count fires per event_kind per hour;
  # warn if delta vs prior 24h > 50% (hook silently broke).
  # ─────────────────────────────────────────────────────────────────
  - id: expected-hooks-firing
    description: Hook firing frequency dropped substantially vs prior 24h
    when:
      event_kind: pre_tool_use
    aggregate:
      window_seconds: 3600
      count_lt: 1
      group_by: event_kind
    verdict: warn
    reason: "An event_kind that fired regularly in the prior 24h has gone silent — hook script possibly broken or removed"
