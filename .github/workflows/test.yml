name: test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  pipeline:
    name: pipeline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml

      - name: CI gate (ci-gate.sh — SSOT for the check list)
        # ci-gate.sh is the single source of truth for the CI check list:
        # shell bash -n, Python ast.parse, JSON manifest validity, SKILL.md
        # frontmatter, iron-laws codegen drift, and the full unittest suite.
        # test.yml just calls it so the two can never drift.
        # --full opts INTO the unittest suite (default is static-only
        # since the agent-callable surface needs to be fast).
        run: bash plugins/kaizen/scripts/ops/ci-gate.sh --full

      - name: Run bash unit tests
        run: |
          bash plugins/kaizen/tests/test_plugin_root.sh

      - name: Smoke — kaizen-export --target codex --dry-run
        # End-to-end: walk the full plugin and produce the Codex bundle.
        # --validate re-parses every emitted .toml + frontmatter so a
        # broken encoder fails the build.
        run: |
          plugins/kaizen/bin/kaizen-export \
            --target codex \
            --out /tmp/kaizen-codex-export \
            --clean \
            --validate

      - name: No GNU-only utilities
        run: |
          # Cross-platform discipline: scripts must work on macOS BSD too.
          if grep -rEn '\breadlink -f\b' \
               plugins/kaizen/skills/workflow/scripts/ \
               plugins/kaizen/hooks/; then
            echo "GNU-only readlink -f found — use python3-based realpath_f instead"
            exit 1
          fi
          if grep -rEn 'find .* -printf' \
               plugins/kaizen/skills/workflow/scripts/ \
               plugins/kaizen/hooks/; then
            echo "GNU-only find -printf found — use shell glob instead"
            exit 1
          fi

      - name: kaizen-surface validate (registration drift)
        # surface.py catches orphan hook scripts, unmounted MCP servers,
        # missing permission entries. Exit 1 on `error` severity;
        # `warn` severities (e.g. orphan-hook-script) surface but
        # don't block — CI annotation visible in the GH UI.
        run: |
          python3 plugins/kaizen/skills/workflow/scripts/surface.py validate
        continue-on-error: false

      - name: kaizen-gatekeeper check --all (aggregate code findings)
        # The unified Python gate: iron-laws + efficient-tool-use anti-
        # patterns + karpathy diff scanners + plugin-validator. Currently
        # NON-BLOCKING (continue-on-error: true) because the plugin's own
        # scripts have ~29 pre-existing findings (eval-on-user-input in
        # enable_all.sh, etc.) that need a dedicated cleanup session
        # before the gate can be made blocking. CI output makes them
        # visible.
        #
        # To make blocking later: flip continue-on-error to false. To
        # silence noisy info-level patterns: --json | jq filter, or wire
        # severity threshold into gatekeeper.py.
        run: |
          python3 plugins/kaizen/skills/workflow/scripts/gatekeeper.py check --all || true
          # always exit 0 — informational for now
        continue-on-error: true
