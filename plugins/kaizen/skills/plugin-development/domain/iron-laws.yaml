# Iron Laws — the non-negotiable rules for kaizen-plugin-original
# development. Each law has:
#
#   id          slug for cross-reference
#   statement   one-line rule (the law itself)
#   severity    hard (commit blocked) | soft (warning surfaced) | info
#   detect      machine-checkable predicate, when one exists
#   why         rationale link to canonical source or memory entry
#
# The SKILL.md prose explains; this yaml is the enforcement spec.

version: 1

laws:
  - id: canonical-edit-path
    statement: "Edit at ~/workspace/kaizen-md/, never the symlink ~/.claude/local-marketplaces/kaizen-md/"
    severity: soft
    detect: "modified-file path starts with ~/.claude/local-marketplaces/kaizen-md/"
    why: "User stated preference; symlink confuses git status / IDE search / path-canonicalization helpers. See ~/.claude/projects/<slug>/memory/feedback_kaizen_plugin_canonical_path.md"

  - id: no-modify-vendored
    statement: "Don't modify vendored skills. Patch upstream first, then refresh via bundle-refresh."
    severity: hard
    detect: "modified file in skills/{kiss,solid,dry,yagni,karpathy,boy-scout-rule,convention-over-configuration,law-of-demeter,separation-of-concerns,brainstorming,executing-plans,writing-plans,using-superpowers,subagent-driven-development,test-driven-development,verification-before-completion,dispatching-parallel-agents,finishing-a-development-branch,using-git-worktrees,writing-skills,receiving-code-review,requesting-code-review,systematic-debugging,tdd,init,remember,process,evolve,reflect,synthesize,status}/"
    why: "Upstream provenance. See CONTRIBUTING.md::Architecture rules and ATTRIBUTIONS.md."

  - id: schema-driven-domain
    statement: "Feature routing / taxonomies / conventions live in domain/*.yaml — not hardcoded in Python."
    severity: soft
    detect: "feature has hardcoded route table without corresponding domain/*.yaml"
    why: "Users edit yaml without rebuilding; tests validate against jsonschema."

  - id: node-flow-for-multi-step
    statement: "Multi-step async ops use flow.AsyncNode + AsyncFlow. No ad-hoc orchestration."
    severity: soft
    detect: "module imports asyncio.gather more than once without subclassing AsyncParallelBatchNode"
    why: "Consistent observability + retry/cycle guards; see skills/workflow/scripts/flow.py docstring."

  - id: lazy-heavy-deps
    statement: "Heavy deps (transformers, torch, tree-sitter, etc.) lazy-load with is_available() + graceful fallback."
    severity: soft
    detect: "top-level `import torch` or `import transformers` outside try/except"
    why: "Default kaizen install must not require ~3GB ML stack. See ~/.claude/brain/Notes/pref-optional-feature-graceful-fallback.md"

  - id: sandbox-tests
    statement: "Tests sandbox via env vars (KAIZEN_<X>_PATH=<tmp>). Never touch real ~/.claude/."
    severity: hard
    detect: "test file writes to ~/.claude/ or ~/workspace/ without KAIZEN_<X>_PATH override"
    why: "Test isolation; CI runs without polluting the user's brain or auto-memory."

  - id: bin-wrapper-per-cli
    statement: "Each CLI script gets its own bin/kaizen-* wrapper. /kaizen:install symlinks bin/ into ~/.local/bin/."
    severity: hard
    detect: "skills/workflow/scripts/<feature>_<op>.py with argparse main but no bin/kaizen-<feature>-<op>"
    why: "Without a wrapper, kaizen-<feature>-<op> is 'command not found' from shell. See brain commit 2cfd234 + bin-wrapper hotfix."

  - id: plugin-manifest-permissions
    statement: "New script + hook entries land with matching plugin.json permission lines in the same commit."
    severity: hard
    detect: "git diff shows new skills/workflow/scripts/<feature>.py or hooks/claude/<feature>-*.sh without matching plugin.json::permissions.allow entry"
    why: "Missing permission entries prompt the user on every invocation; structural cohesion."

  - id: hook-bypass-knob
    statement: "Every hook script reads KAIZEN_<FEATURE>_DISABLE env early and exits 0 when set."
    severity: hard
    detect: "hooks/claude/<feature>-*.sh missing `KAIZEN_*_DISABLE` guard"
    why: "User must be able to disable any hook without uninstalling the plugin."

  - id: claude-md-no-volatile-data
    statement: "Don't write commit SHAs, dates, or LOC counts into CLAUDE.md / README.md. Use CHANGELOG / git log / progress.md."
    severity: hard
    detect: "claude-md-no-sha gate check"
    why: "CLAUDE.md is the durable rulebook; volatile data rots."

  - id: phased-commit-template
    statement: "Atomic per-item commit using the phased-work template (subject / motivation / Files / env / test baseline / refs)."
    severity: soft
    detect: "git commit message length < 200 chars on a structural change"
    why: "Phased commits read as a coherent rollout in git log. See ~/.claude/brain/Notes/pref-phased-work-commit-template.md"

  - id: paired-tests
    statement: "Every new .py / .sh script in plugin-original code has a matching test in tests/test_<x>.py."
    severity: soft
    detect: "git diff adds skills/workflow/scripts/<f>.py without adding/modifying tests/test_<f>*.py"
    why: "Existing gate check (paired-test, severity=warn). See workflow skill PART 3."

  - id: skill-cant-be-skipped
    statement: "When touching plugin-original code, the plugin-development skill is mandatory-load."
    severity: soft
    detect: "session enters kaizen-md cwd without plugin-development in loaded-skills"
    why: "User stated: 'the dev skill can't be skipped' — codified 2026-05-14."

  - id: bin-wrapper-per-cli-strict
    statement: "Every Python script with an argparse main() under skills/workflow/scripts/ MUST have a matching bin/kaizen-* wrapper landed in the SAME commit. Specialized op scripts (e.g. brain_index.py / brain_promote.py / metrics.py) need their own wrappers — one bin per CLI script."
    severity: hard
    detect: "git diff shows new skills/workflow/scripts/<f>.py with `if __name__ == \"__main__\"` + argparse but no bin/kaizen-<feature>[-<op>] in the same commit"
    why: "Hit twice this session: brain shipped only kaizen-brain (missing -index/-promote/-audit/-evolve, fixed in commit ed4b490); metrics shipped only kaizen-metrics. /kaizen:install symlinks bin/ entries into ~/.local/bin/, so a missing wrapper = 'command not found' from shell. The plugin-development validator's wiring-checklist enforces this via scripts/validate.py."

  - id: slash-command-args-no-default-spaces
    statement: "Slash command `${ARGUMENTS:-default}` template only bash-evaluates the `:-default` when the default has NO whitespace. For multi-word defaults, give the underlying script a no-arg fallback and pass bare `$ARGUMENTS` (no curly braces, no default)."
    severity: hard
    detect: "commands/<feature>.md contains `${ARGUMENTS:-<default with spaces>}`"
    why: "Hit on /kaizen:metrics — user ran `top --kind skill`, slash dispatched `lifetime --since 7d` (the bash default fell through because CC's template substitution + bash interaction couldn't handle the space). Fixed by giving metrics.py a no-arg default (runs 7d lifetime) and changing slash to bare `$ARGUMENTS`. See onboard.md / trace-search.md for short-default examples that work."

  - id: hooks-json-additive-event-multi-command
    statement: "When adding a hook to an ADDITIVE_EVENT (SubagentStop / SessionEnd / Notification) that already has a config block, APPEND to the existing block's `hooks:[]` list — don't add a sibling block with the same matcher."
    severity: soft
    detect: "hooks.json::<EVENT> has 2+ config blocks with matcher='*'"
    why: "test_cc_hooks_wireup.py originally asserted exactly 1 config block per ADDITIVE_EVENT. Relaxed 2026-05-14 to allow >= 1 commands, but the convention is still to append within one block for the same matcher."

  - id: trace-coverage-all-tools
    statement: "Hook scripts that fire on PreToolUse / PostToolUse should cover ALL tools (matcher='*'), not just Bash. The universal pretooluse-trace.sh / posttooluse-trace.sh fire for Skill / Edit / Write / mcp__* / etc. — don't add per-tool hooks that re-trace what the universal already captures."
    severity: soft
    detect: "new hook script in hooks/claude/ fires `_trace.sh` with a tool name already covered by the universal hooks"
    why: "Until M1 (2026-05-14), only Bash had trace coverage. 30K events captured, 0 skill invocations. The universal trace fixed it; new hooks should rely on it for tool-call traces, not re-add per-tool tracing."

  - id: metrics-skip-check-before-merge
    statement: "Before merging any structural change touching plugin-original code, run `kaizen-metrics skips --json` to confirm no mandatory-skill-load was missed."
    severity: soft
    detect: "session touched plugins/kaizen/** files without `Skill(plugin-development)` invocation; surfaced via metrics-session-end.sh hook"
    why: "Self-correction signal. The SessionEnd hook auto-writes drafts to brain/Inbox/; surfacing the same check pre-merge catches violations before they ship."

  - id: skill-md-no-exec-markers
    statement: "Don't put a `!`-backtick exec marker in a SKILL.md body. The Skill tool executes them at skill-load time. Document slash-command bodies as PROSE or INDENTED plain-text blocks — never as `!`-backtick markup, fenced or not. Fence-type matters and is fragile: a ```bash fence did NOT protect the marker (it ran + errored); a ```markdown fence appeared to. Don't rely on that — just don't use the marker."
    severity: soft
    detect: "skills/<feature>/SKILL.md contains `!` immediately followed by a backtick (any column, any fence)"
    why: "Hit 2026-05-14: loading Skill(plugin-development) errored — its SKILL.md had `!`bash -c '...'`` examples inside a ```bash fence that the loader ran anyway (the literal `...` in the example then failed as a command). plugin-pitfalls documents the same gotcha but keeps its example inside a ```markdown fence which apparently didn't fire — fragile. SKILL.md is documentation; only commands/*.md files carry live exec markers."

  - id: every-hook-script-traces-its-firing
    statement: "Every hook script in hooks/claude/ MUST fire `_trace.sh` (or `trace.py event`) so its lifecycle is visible to kaizen-metrics. The universal pretooluse/posttooluse trace covers TOOL calls; hook-internal firing needs its own trace line."
    severity: soft
    detect: "hooks/claude/<f>.sh (excluding _trace.sh itself) with no `_trace.sh` / `trace.py event` reference"
    why: "Self-audit's hook-trace-coverage stage flags these. Pre-fix, brain-session-end / brain-user-prompt / karpathy-gate / metrics-session-end / stop-ralph fired invisibly — no signal that the hook ran. Fixed 2026-05-14 (commit 691944f)."
