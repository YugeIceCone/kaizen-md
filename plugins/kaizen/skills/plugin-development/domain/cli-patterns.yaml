# CLI patterns observed in kaizen-md plugin-original code.
#
# Discovered via grep + AST inventory pass (2026-05-20). Each pattern
# carries: id / shape / count (adoption signal) / why / detect (grep
# recipe to re-verify count) / iron_law (rule that enforces, if any).
#
# Authoring guideline: when adding a new kaizen-* CLI, follow at least
# patterns 1, 2, 4, 6 (the universal ones). Patterns 3, 5, 7-10 are
# context-dependent — apply where the shape fits.
#
# This catalog is the SSOT consumed by `kaizen patterns` (the
# scripts/cli/kaizen_cli.py dispatcher).

version: 1
description: |
  Canonical CLI patterns for kaizen plugin-original code. Promotes the
  conventions encoded in iron-laws.yaml + the canonical-feature-shape
  into a single grep-verified catalog.

patterns:
  - id: argparse-subparsers
    shape: "argparse + sub = ap.add_subparsers(dest='cmd', required=True)"
    count: 159
    why: |
      Standard shape for any kaizen CLI with ≥3 verbs. Bash case
      statement >5 branches is the anti-pattern (becomes a maintenance
      pit). argparse gives free --help, error messages, subcommand
      discovery.
    detect: "grep -rl 'add_subparsers' plugins/kaizen/scripts/ plugins/kaizen/skills/workflow/scripts/"
    iron_law: null

  - id: json-flag
    shape: "--json switch alongside the human-readable default"
    count: 205
    why: |
      Machine-readable parallel to human output. Same command renders
      both: `kaizen-X` for terminal, `kaizen-X --json` for pipelines.
      Validated externally — same pattern in simonw/csv-diff.
    detect: 'grep -rl -- "--json" plugins/kaizen/scripts/ plugins/kaizen/skills/workflow/scripts/'
    iron_law: null

  - id: envelope-emitter
    shape: "_emit = _envelope.emitter('kaizen-<name>', tool_version='X.Y.Z')"
    count: 67
    why: |
      Structured stderr emission. Every public CLI declares its
      tool-name once via the emitter; subsequent emit() calls carry
      that name + ISO timestamp + envelope schema. Feeds the trace log.
    detect: "grep -rl '_envelope.emitter' plugins/kaizen/scripts/"
    iron_law: bin-wrapper-per-cli  # name must match the bin symlink

  - id: disable-env-knob
    shape: "KAIZEN_<FEATURE>_DISABLE=1 early-exits the CLI as a no-op"
    count: 107
    why: |
      Every hook/feature MUST honor a bypass knob — iron-law
      hook-bypass-knob (hard, auto). Lets users opt out per-feature
      without uninstalling. Convention is checked very first thing,
      before any heavy import.
    detect: "grep -rl 'KAIZEN_.*_DISABLE' plugins/kaizen/scripts/ plugins/kaizen/hooks/"
    iron_law: hook-bypass-knob

  - id: bash-strict-mode
    shape: "set -uo pipefail (or -euo) at the top of every .sh"
    count: 66
    why: |
      Fail-fast on unset vars + pipeline errors. Without this, a typo
      in a variable name silently expands to '' and the script
      continues. -e adds exit-on-error; sometimes omitted when the
      script has its own error-handling.
    detect: "grep -rl 'set -uo pipefail\\|set -euo pipefail' plugins/kaizen/scripts/ plugins/kaizen/hooks/"
    iron_law: null

  - id: bin-wrapper-exec
    shape: "bin/kaizen-X: bash wrapper that exec's python3 (or uv run)"
    count: 85
    why: |
      One-line dispatch keeps the bin tiny + lets the Python script
      own argparse + version. KISS: no Python startup in the wrapper.
      Optional uv-venv routing for heavy-dep verbs (numpy, sentence-
      transformers) — see bin/kaizen-brain (index/evolve route via uv).
    detect: "grep -l 'exec python3\\|exec uv run' plugins/kaizen/bin/*"
    iron_law: bin-wrapper-per-cli

  - id: consolidated-cli-parent
    shape: "# consolidated-cli-parent: <name> marker in source header"
    count: 39
    why: |
      Marks a single CLI that dispatches to many verbs (e.g.
      kaizen-brain). Exempts the file from the strict 1:1 bin-wrapper-
      per-cli iron-law (would otherwise require one bin per verb).
      Detected by iron-laws checker.
    detect: "grep -rln 'consolidated-cli-parent:' plugins/kaizen/"
    iron_law: bin-wrapper-per-cli  # exemption-granting marker

  - id: prog-matches-bin
    shape: "argparse.ArgumentParser(prog='kaizen-<name>') matches bin symlink"
    count: 47
    why: |
      Argparse's --help shows the actual invocation name (not the
      Python file name). Three-way drift class — prog vs bin symlink
      vs envelope tool-name — caught by BK-052 iron-law extension.
    detect: 'grep -rln "argparse.ArgumentParser(prog=" plugins/kaizen/scripts/'
    iron_law: bin-wrapper-per-cli  # extension proposed in BK-052

  - id: stdin-json-hook
    shape: "Python hook reads CC event JSON from sys.stdin"
    count: 11
    why: |
      Claude Code lifecycle hooks pipe event JSON to stdin. Hook
      writers parse it with json.load(sys.stdin); emit
      hookSpecificOutput.additionalContext via stdout JSON. Always
      exit 0 to avoid breaking the hook chain.
    detect: "grep -rl 'json.load(sys.stdin)' plugins/kaizen/scripts/handlers/ plugins/kaizen/hooks/claude/"
    iron_law: hook-bypass-knob

  - id: env-overridable-paths
    shape: "os.environ.get('KAIZEN_<X>_DIR', default_path)"
    count: 213
    why: |
      Every feature dir resolves through _paths.py (or its env-knob
      counterpart) so tests can sandbox via KAIZEN_<X>_DIR. Convention:
      re-read env at call time (not at import time) so test monkey-
      patches take effect.
    detect: 'grep -rn "KAIZEN_.*_DIR\\|KAIZEN_.*_PATH" plugins/kaizen/scripts/'
    iron_law: sandbox-tests
