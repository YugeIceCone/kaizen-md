# Handoff feature — schema-driven v2 manifest.
#
# Declares subcommands → input/output JSON Schemas, walked by
# schema_cli.py (skills/schema-driven-cli/). Each subcommand's contract
# lives in domain/schemas/; rule-driven behaviors live in their own
# rule yamls (verify-rules.yaml, outcome-rubric.yaml, etc.).
#
# Refactored from the recovered ~/.claude/scripts/stores.py — the lost
# handoff DB helper, now plugin-owned (see CHANGELOG 1.36.0).

version: 2
feature: handoff
description: >-
  Create + resume + verify session handoff documents. The filesystem
  YAML at <handoffs_dir>/<session>/<ts>.yaml is the system of record;
  the SQLite store (handoff.db) is the queryable index.

# Where things live. Both env-overridable — KAIZEN_HANDOFF_DB and
# KAIZEN_HANDOFF_DIR — see _handoff.py for the resolution logic.
# Documentation-only; not consumed by code.
paths:
  db: "~/.claude/.kaizen/data/handoff.db"
  yaml_dir: "~/.claude/thoughts/handoffs"

# Documentation-only — the authoritative tuples live in
# _handoff.py::VALID_STATUS / VALID_OUTCOME.
status:
  - partial      # work in progress, or the placeholder at write time
  - complete     # the session's work is done
  - blocked      # work stopped on an external blocker

outcome:
  - IN_PROGRESS    # placeholder written at create time, before Step 4
  - SUCCEEDED      # task completed successfully
  - PARTIAL_PLUS   # mostly done, minor issues remain
  - PARTIAL_MINUS  # some progress, major issues remain
  - FAILED         # task abandoned or blocked

# v2 lens contract — subcommands declare their input/output schemas.
# Schema paths resolve relative to THIS manifest file.
#
# Migration policy: schemas land incrementally. A subcommand with no
# declared schemas no-ops in the lens (passthrough). Existing
# _cmd_save / latest / list / bridge / path / auto-finalize keep
# emitting via _envelope.emitter() directly until they migrate.
subcommands:
  verify:
    description: >-
      Mechanical structural verification of a handoff YAML against
      the current tree — file existence, git modification deltas,
      pattern presence/regression, commit count since handoff date.
      Replaces resume Step 3's sub-agent fan-out.
    input_schema:  schemas/verify-in.schema.json
    output_schema: schemas/verify-report.schema.json

  assess:
    description: >-
      Compute mechanical signals from a handoff YAML
      (completed_ratio, test_delta, blocker_count, next_blocking_count)
      and walk outcome-rubric.yaml to recommend an outcome bucket.
      Returns NEEDS_AGENT when the rubric falls through — agent picks
      qualitatively, then passes to auto-finalize --outcome.
    input_schema:  schemas/assess-in.schema.json
    output_schema: schemas/assess-out.schema.json

  scaffold:
    description: >-
      Git-driven YAML pre-fill. Writes a partially-filled handoff YAML
      from git state (date, files.modified, files.created,
      done_this_session.files) so the agent only writes the
      qualitative content (decisions, findings, worked, failed, next).
      Saves ~20–50% of Step-2 token cost.
    input_schema:  schemas/scaffold-in.schema.json
    output_schema: schemas/scaffold-out.schema.json

  create:
    description: >-
      One-shot structured-input handoff write. Accepts a typed JSON
      payload (via --stdin or --data-file), validates, generates valid
      YAML (handles `: ` colon-space escaping), writes atomically, and
      indexes into the DB. Collapses Steps 1+2+3 of the legacy create
      flow into one subcommand.
    input_schema:  schemas/create-in.schema.json
    output_schema: schemas/create-out.schema.json

  # Pre-existing subcommands — declared for discovery; schemas land
  # in their own migration commits per the lens skill's "incremental"
  # guidance.
  save: {}
  latest: {}
  list: {}
  bridge: {}
  path: {}
  auto-finalize: {}
