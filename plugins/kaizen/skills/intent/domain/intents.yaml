# kaizen-intent rules — declarative intent → action mapping.
#
# Each intent has:
#   id           - unique kebab-case identifier
#   description  - one-line summary
#   triggers     - list of phrase or event_pattern triggers (any fires)
#   action       - what to suggest/run (suggest + subcommand + confidence)
#
# Trigger kinds (MVP):
#   phrase:        regex/literal text match (case_insensitive optional)
#   event_pattern: dxm event sequence threshold (count_at_least within
#                  window_seconds; optional evt_type / tool_name /
#                  exit_code_nonzero filters)
#
# Confidence (0.0-1.0) ranks matches in `suggest` (highest wins).

version: 1

intents:
  # ─── Session-management intents ──────────────────────────────────

  - id: wrap-up
    description: User signals end-of-session — suggest handoff create.
    triggers:
      - { kind: phrase, pattern: "let'?s wrap (this )?up", case_insensitive: true }
      - { kind: phrase, pattern: "wrap.*session", case_insensitive: true }
      - { kind: phrase, pattern: "(end|finish).*session", case_insensitive: true }
      - { kind: phrase, pattern: "(create|write).*handoff", case_insensitive: true }
    action:
      suggest: "kaizen-handoff scaffold --session <project>  # then edit qualitative fields → assess → auto-finalize"
      subcommand: handoff-scaffold
      confidence: 0.9

  - id: resume-prior
    description: User wants to pick up prior session — suggest handoff resume.
    triggers:
      - { kind: phrase, pattern: "(resume|continue|pick up).*(last|prior|previous).*session", case_insensitive: true }
      - { kind: phrase, pattern: "where (did|were) we (left|stop)", case_insensitive: true }
    action:
      suggest: "kaizen-handoff resume  # loads latest handoff + verify"
      subcommand: handoff-resume
      confidence: 0.9

  # ─── Context-pressure intents ────────────────────────────────────

  - id: context-pressure
    description: User mentions context is full — suggest /compact.
    triggers:
      - { kind: phrase, pattern: "context.*(high|tight|full|9[0-9]%|exhausted)", case_insensitive: true }
      - { kind: phrase, pattern: "running out of (context|tokens)", case_insensitive: true }
    action:
      suggest: "/compact  # reclaims context window via Anthropic-side summarization"
      subcommand: compact
      confidence: 0.85

  # ─── Debugging intents ───────────────────────────────────────────

  - id: repeated-bash-failures
    description: 3+ failing Bash calls in 60s — suggest investigation.
    triggers:
      - kind: event_pattern
        evt_type: PostToolUse
        tool_name: Bash
        exit_code_nonzero: true
        count_at_least: 3
        window_seconds: 60
    action:
      suggest: "3+ Bash failures in 60s — investigate root cause before continuing"
      subcommand: debug
      confidence: 0.95

  - id: stuck-on-error
    description: User mentions debugging / stuck — surface verify + recent failures.
    triggers:
      - { kind: phrase, pattern: "(stuck|hit a wall|can'?t figure out)", case_insensitive: true }
      - { kind: phrase, pattern: "(debug|investigate).*error", case_insensitive: true }
    action:
      suggest: "kaizen-dxm tail --back 120 + kaizen-handoff verify  # surface last 2 min + tree state"
      subcommand: debug
      confidence: 0.7

  # ─── Testing intents ─────────────────────────────────────────────

  - id: tdd-prompt
    description: User signals net-new code — load /tdd.
    triggers:
      - { kind: phrase, pattern: "(implement|build|create|add).*(feature|component|module|function)", case_insensitive: true }
      - { kind: phrase, pattern: "net.?new (code|feature|module)", case_insensitive: true }
    action:
      suggest: "Load Skill(kaizen:tdd) + consider /workflow schema=onion-tdd-strict  # net-new code lands test-first per Persona pref-tdd-for-new-code"
      subcommand: tdd
      confidence: 0.8

  # ─── Refactor + architecture intents ─────────────────────────────

  - id: refactor-prompt
    description: User signals refactor — load onion-ddd + coding-skills.
    triggers:
      - { kind: phrase, pattern: "refactor", case_insensitive: true }
      - { kind: phrase, pattern: "(restructure|reorganize).*code", case_insensitive: true }
    action:
      suggest: "Load Skill(kaizen:onion-ddd-workflow) + consider /workflow schema=onion-tdd-strict  # touched coding-skills/* per Persona Directives"
      subcommand: refactor
      confidence: 0.75

  - id: code-task-strict
    description: Any code task (implement / refactor / fix bug / add feature) — suggest the onion-tdd-strict schema (per Persona pref-onion-tdd-strict).
    triggers:
      - { kind: phrase, pattern: "\\b(implement|refactor|add feature|fix (a |the )?bug|code task)\\b", case_insensitive: true }
    action:
      suggest: "/workflow schema=onion-tdd-strict  # 10-stage gated discipline: audit → design-layers → red-test → green-impl → refactor → adapters → composition → supervisor → trace-wire → verify"
      subcommand: workflow-onion-tdd-strict
      confidence: 0.7

  # ─── Mode / intake intents ───────────────────────────────────────
  #
  # User is gesturing toward a session shape. Surface /kaizen:workflow
  # so they can record the choice + pick disciplines once, instead of
  # the agent having to re-derive the right shape each turn. Three
  # rules: explicit loop intent, explicit workflow intent, and a
  # generic "set up the session" catch-all. All three pick the
  # session-scope branch of /kaizen:workflow — Q1 = "This session only"
  # (the folded /kaizen:session-mode replacement).

  - id: start-loop
    description: User wants iterative self-correcting work — suggest /kaizen:workflow session-scope=loop.
    triggers:
      - { kind: phrase, pattern: "(iterate|loop) on (this|that|it)", case_insensitive: true }
      - { kind: phrase, pattern: "(use|start|run) (a |the )?(ralph[- ]?)?loop", case_insensitive: true }
      - { kind: phrase, pattern: "ralph (this|it|the)", case_insensitive: true }
      - { kind: phrase, pattern: "self[- ]correcting loop", case_insensitive: true }
      - { kind: phrase, pattern: "(keep|continue) (trying|working|going) until", case_insensitive: true }
      - { kind: phrase, pattern: "(iterate|loop) until (it|the|all)", case_insensitive: true }
    action:
      suggest: "/kaizen:workflow  # Q1 → 'This session only', Q2 → 'Loop' (replaces retired /kaizen:session-mode loop)"
      subcommand: mode-loop
      confidence: 0.8

  - id: start-workflow
    description: User wants multi-stage routine work — suggest /kaizen:workflow session-scope=workflow.
    triggers:
      - { kind: phrase, pattern: "(use|start|run) (a |the )?workflow", case_insensitive: true }
      - { kind: phrase, pattern: "multi[- ]stage", case_insensitive: true }
      - { kind: phrase, pattern: "(explore|analyze).{0,30}(plan|execute)", case_insensitive: true }
      - { kind: phrase, pattern: "harden (this|the) (plugin|codebase|code|repo)", case_insensitive: true }
      - { kind: phrase, pattern: "(audit|review).{0,30}(remediate|fix)", case_insensitive: true }
      - { kind: phrase, pattern: "(create|write).{0,15}plan.{0,30}execute", case_insensitive: true }
    action:
      suggest: "/kaizen:workflow  # Q1 → 'This session only', Q2 → 'Routine' (replaces retired /kaizen:session-mode workflow)"
      subcommand: mode-workflow
      confidence: 0.8

  - id: set-mode-generic
    description: User wants to configure the session shape — suggest /kaizen:workflow full QA.
    triggers:
      - { kind: phrase, pattern: "(set|configure|pin|choose).{0,15}(session )?mode", case_insensitive: true }
      - { kind: phrase, pattern: "what (mode|kind of session)", case_insensitive: true }
      - { kind: phrase, pattern: "(pin|enforce|apply).{0,15}(disciplines?|skills?)", case_insensitive: true }
      - { kind: phrase, pattern: "configure (this |the )?session", case_insensitive: true }
    action:
      suggest: "/kaizen:workflow  # full 4-Q wizard — scope (session/project/global), run-mode, disciplines, threshold (folds the retired /kaizen:session-mode slash)"
      subcommand: mode-qa
      confidence: 0.7

  # ─── Forked-skill auto-suggest intents ────────────────────────────
  #
  # The 3 originally-vendored claude-code-skills (code-tour, karpathy,
  # self-improving) now have slash commands AND intent triggers so the
  # agent can surface them mid-conversation when user phrasing implies
  # the relevant flow.

  - id: code-tour-suggest
    description: User wants a code walkthrough — suggest the code-tour skill.
    triggers:
      - { kind: phrase, pattern: "walk (me|us) (through|over)", case_insensitive: true }
      - { kind: phrase, pattern: "(tour|walkthrough) (this|that|the) (codebase|repo|pr|module|change)", case_insensitive: true }
      - { kind: phrase, pattern: "(onboarding|architecture|rca|security|vibe.?check) tour", case_insensitive: true }
      - { kind: phrase, pattern: "(write|create|build).*tour for", case_insensitive: true }
      - { kind: phrase, pattern: "(explain|show me) how (this|that|the).*works", case_insensitive: true }
    action:
      suggest: "Load Skill(kaizen:code-tour) to scaffold a persona-targeted .tour walkthrough"
      subcommand: code-tour
      confidence: 0.8

  - id: karpathy-review
    description: User wants a diff-level review — suggest /kaizen:karpathy-check.
    triggers:
      - { kind: phrase, pattern: "review (my|the|this) (diff|changes?|patch)", case_insensitive: true }
      - { kind: phrase, pattern: "(is|am i) (this )?(over.?complicated|overcoded|over.?engineered)", case_insensitive: true }
      - { kind: phrase, pattern: "check (complexity|noise|surgery) of", case_insensitive: true }
      - { kind: phrase, pattern: "karpathy (check|review|gate)", case_insensitive: true }
      - { kind: phrase, pattern: "(am i|are these).*assumptions", case_insensitive: true }
    action:
      suggest: "/kaizen:karpathy-check  # complexity + diff-noise + assumption + goal scanners"
      subcommand: karpathy-check
      confidence: 0.85

  - id: self-improving-curate
    description: User wants to curate auto-memory — daemon runs this on tick; suggest the bin for on-demand invocation.
    triggers:
      - { kind: phrase, pattern: "(what (has|have) (claude|i|we) learned)", case_insensitive: true }
      - { kind: phrase, pattern: "(promote|graduate) (this|that) (learning|pattern|rule)", case_insensitive: true }
      - { kind: phrase, pattern: "(curate|review|audit) (auto.?)?memory", case_insensitive: true }
      - { kind: phrase, pattern: "(memory|brain) health", case_insensitive: true }
      - { kind: phrase, pattern: "(extract|distill) (a )?skill from", case_insensitive: true }
      - { kind: phrase, pattern: "self.?improv(e|ing)", case_insensitive: true }
    action:
      suggest: "kaizen-self-improving  # review | promote | extract | health (bin form; daemon runs on tick)"
      subcommand: self-improving
      confidence: 0.75

  # ─── Commit / publish intents ────────────────────────────────────

  - id: pre-commit-check
    description: User about to commit — suggest karpathy + iron-laws check.
    triggers:
      - { kind: phrase, pattern: "(before|about to|ready to) commit", case_insensitive: true }
      - { kind: phrase, pattern: "(stage|staged).*for commit", case_insensitive: true }
    action:
      suggest: "kaizen gatekeeper check --staged + /kaizen:karpathy-check  # gate before commit"
      subcommand: gatekeeper
      confidence: 0.85

  # ─── Plugin-development hub auto-routing ─────────────────────────

  - id: plugin-dev-intake
    description: User wants to start plugin-development work — suggest the intake QA so they Skill-load the right bundle BEFORE writing code.
    triggers:
      - { kind: phrase, pattern: "(add|build|ship|create).{0,20}(feature|skill|hook|command|mcp|bin)", case_insensitive: true }
      - { kind: phrase, pattern: "plugin.dev (workflow|routine|intake)", case_insensitive: true }
      - { kind: phrase, pattern: "(which|what) skills (should i|to) (load|use)", case_insensitive: true }
      - { kind: phrase, pattern: "intake checklist", case_insensitive: true }
      - { kind: phrase, pattern: "feature shape", case_insensitive: true }
    action:
      suggest: "/kaizen:plugin-development intake  # agent asks AskUserQuestion → returns the skill bundle for the work-type"
      subcommand: plugin-development
      confidence: 0.85

  - id: plugin-dev-dispatch
    description: User about to dispatch a subagent — suggest the dispatch-rubric to pick the right one.
    triggers:
      - { kind: phrase, pattern: "(dispatch|spawn|use) (a |the )?(sub)?agent", case_insensitive: true }
      - { kind: phrase, pattern: "which (sub)?agent (type|should)", case_insensitive: true }
      - { kind: phrase, pattern: "(implement|build).*in (a |an )?(isolated )?worktree", case_insensitive: true }
    action:
      suggest: "/kaizen:plugin-development dispatch  # walks the dispatch-rubric; recommends kaizen-implementer for TDD-in-worktree"
      subcommand: plugin-development
      confidence: 0.8

  # ─── Audit-axis routing (per-axis suggestions) ───────────────────

  - id: audit-coverage
    description: User asks about test coverage — point at the code-to-test mapper.
    triggers:
      - { kind: phrase, pattern: "(test|code).coverage", case_insensitive: true }
      - { kind: phrase, pattern: "what.{0,5}(untested|uncovered)", case_insensitive: true }
      - { kind: phrase, pattern: "coverage (gap|report)", case_insensitive: true }
    action:
      suggest: "kaizen-coverage gaps  # 1:1 script ↔ test-file presence (bin; slash folded into /kaizen:audit)"
      subcommand: coverage
      confidence: 0.85

  - id: audit-schema-coverage
    description: User asks about feature-shape conformance — point at schema-coverage.
    triggers:
      - { kind: phrase, pattern: "schema.coverage", case_insensitive: true }
      - { kind: phrase, pattern: "feature shape (gap|conformance)", case_insensitive: true }
    action:
      suggest: "/kaizen:schema-coverage gaps  # which features deviate from canonical shapes"
      subcommand: schema-coverage
      confidence: 0.85

  - id: audit-name-quality
    description: User asks about filename intent — point at name-quality.
    triggers:
      - { kind: phrase, pattern: "name.quality", case_insensitive: true }
      - { kind: phrase, pattern: "filename (intent|match)", case_insensitive: true }
      - { kind: phrase, pattern: "(bad|poor) (file )?names?", case_insensitive: true }
    action:
      suggest: "/kaizen:name-quality gaps  # filename ↔ docstring intent mismatches"
      subcommand: name-quality
      confidence: 0.85

  - id: audit-frontmatter
    description: User asks about SKILL.md frontmatter health — point at frontmatter audit.
    triggers:
      - { kind: phrase, pattern: "frontmatter (gap|coverage|audit)", case_insensitive: true }
      - { kind: phrase, pattern: "skill (routing|discoverable)", case_insensitive: true }
      - { kind: phrase, pattern: "weak (routing|trigger)", case_insensitive: true }
    action:
      suggest: "/kaizen:frontmatter gaps  # SKILL.md name/trigger conformance"
      subcommand: frontmatter
      confidence: 0.85

  - id: audit-token-bloat
    description: User asks about token costs — point at token-bloat scanner.
    triggers:
      - { kind: phrase, pattern: "token.bloat", case_insensitive: true }
      - { kind: phrase, pattern: "(too many|wasted|excess) tokens?", case_insensitive: true }
      - { kind: phrase, pattern: "trim (the )?(skill|prompt)", case_insensitive: true }
    action:
      suggest: "/kaizen:gatekeeper check token-bloat  # scan for high-cost low-value content"
      subcommand: gatekeeper
      confidence: 0.85

  # ─── Lifecycle commands (the 11 uncovered admin verbs) ───────────

  - id: plugin-install
    description: User wants to install/setup the plugin — suggest setup.
    triggers:
      - { kind: phrase, pattern: "install (the )?(kaizen )?plugin", case_insensitive: true }
      - { kind: phrase, pattern: "(set up|setup) (the )?(kaizen )?(plugin|gate)", case_insensitive: true }
      - { kind: phrase, pattern: "bootstrap (the )?(kaizen )?plugin", case_insensitive: true }
    action:
      suggest: "/kaizen:setup install  # or kaizen-bootstrap bin for the uv venv warm-up"
      subcommand: setup
      confidence: 0.85

  - id: plugin-update
    description: User wants to update the plugin / refresh CC cache.
    triggers:
      - { kind: phrase, pattern: "(update|upgrade) (the )?(kaizen )?plugin", case_insensitive: true }
      - { kind: phrase, pattern: "refresh (the )?(plugin )?cache", case_insensitive: true }
      - { kind: phrase, pattern: "pull (the )?(plugin )?(updates|changes)", case_insensitive: true }
    action:
      suggest: "/kaizen:update  # git-pull + cache refresh + reload"
      subcommand: update
      confidence: 0.85

  - id: plugin-health
    description: User asks about plugin health / status / hygiene.
    triggers:
      - { kind: phrase, pattern: "(plugin|kaizen) (health|status)", case_insensitive: true }
      - { kind: phrase, pattern: "(broken )?(symlinks?|missing scripts?)", case_invariant: true, case_insensitive: true }
      - { kind: phrase, pattern: "(clean|hygiene|cleanup) (the )?plugin", case_insensitive: true }
    action:
      suggest: "/kaizen:health  # broken symlinks / missing scripts / schema drift  → kaizen-hygiene bin to clean"
      subcommand: health
      confidence: 0.8

  - id: plugin-backup
    description: User wants to snapshot/restore plugin state.
    triggers:
      - { kind: phrase, pattern: "(backup|snapshot) (the )?(plugin|kaizen|state)", case_insensitive: true }
      - { kind: phrase, pattern: "restore (a |from )?(backup|snapshot)", case_insensitive: true }
    action:
      suggest: "/kaizen:backup list  # then restore <id> or create"
      subcommand: backup
      confidence: 0.85

  # ─── One-off helpers (gold / inbox / metrics / discovery) ────────

  - id: gold-capture
    description: User captured a gold pattern — point at kaizen-gold.
    triggers:
      - { kind: phrase, pattern: "capture (a |this )?(gold )?pattern", case_insensitive: true }
      - { kind: phrase, pattern: "(gold|incidental) (capture|learning|discovery)", case_insensitive: true }
      - { kind: phrase, pattern: "promote.*to brain (note|file)", case_insensitive: true }
    action:
      suggest: "kaizen-gold capture \"<pattern>\" --tag X  # or list / promote --brain"
      subcommand: gold
      confidence: 0.85

  - id: inbox-review
    description: User wants to review queued inbox items.
    triggers:
      - { kind: phrase, pattern: "(my |the )?inbox", case_insensitive: true }
      - { kind: phrase, pattern: "(draft|pending) (memory|review)", case_insensitive: true }
    action:
      suggest: "kaizen-inbox list  # peek / drain / clear"
      subcommand: inbox
      confidence: 0.7

  - id: metrics-skips
    description: User asks about skill-skip detection / adoption metrics.
    triggers:
      - { kind: phrase, pattern: "(skill )?skips?", case_insensitive: true }
      - { kind: phrase, pattern: "(adoption|never.used) (metric|stat)", case_insensitive: true }
      - { kind: phrase, pattern: "(session )?metrics", case_insensitive: true }
    action:
      suggest: "kaizen-metrics skips  # also: lifetime | never-used | graveyard"
      subcommand: metrics
      confidence: 0.8

  - id: discover-codebase
    description: User starts onboarding to a new codebase — semantic index.
    triggers:
      - { kind: phrase, pattern: "(onboard|index) (the |this )?(codebase|repo|project)", case_insensitive: true }
      - { kind: phrase, pattern: "semantic (search|index) (over|of)", case_insensitive: true }
      - { kind: phrase, pattern: "(code )?tour", case_insensitive: true }
    action:
      suggest: "kaizen-onboard <repo>  # semantic SQLite index; pair with Skill(kaizen:code-tour) for a narrated walkthrough"
      subcommand: onboard
      confidence: 0.8

  - id: discover-claude-docs
    description: User asks about Claude API/Code docs — point at the local mirror.
    triggers:
      - { kind: phrase, pattern: "claude (api|code) (docs|reference|guide)", case_insensitive: true }
      - { kind: phrase, pattern: "(how does|how do i) (claude|cc) (api|hook|mcp|tool)", case_insensitive: true }
    action:
      suggest: "kaizen-claude-docs <query>  # local semantic search over the docs mirror"
      subcommand: claude-docs
      confidence: 0.75
