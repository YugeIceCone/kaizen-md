# kaizen auto-handoff config — schema-driven trigger + decision policy.
# Validated against domain/schemas/config.schema.json.
# Override via KAIZEN_AUTO_HANDOFF_CONFIG env var (absolute path).

version: 1

# The four user-pickable threshold levels (% of context-window limit).
# Single source of truth — session_mode.py imports this list to
# validate --threshold inputs.
valid_thresholds: [25, 50, 75, 85]

# dxm event type written on first fire (the dedupe marker). Subsequent
# invocations look for this evt_type in the session's dxm log and skip
# re-firing when found.
dedupe_event_type: "auto_handoff.requested"

on_fire:
  # "block"          — Stop hook returns {"decision":"block","reason":…}
  #                    Agent CANNOT exit until handoff is created.
  # "systemMessage"  — soft suggestion (advisory). Agent may skip.
  # Default is "block" — see SKILL.md "Contract" section.
  # When rubric.yaml exists, on_bucket overrides this for each bucket.
  decision: "block"

  # Template for the reason text. Substitution: {pct} {threshold} {tokens}.
  # KEEP TIGHT — every fire burns this into the agent's context.
  # The agent already has the auto-handoff skill loaded; no need to
  # re-explain the steps here.
  reason_template: |
    ⚠ MANDATORY pre-compact handoff (context {pct}%, threshold {threshold}%). Stop BLOCKED.
    kaizen-handoff scaffold → fill fields → auto-finalize. Bypass: KAIZEN_AUTO_HANDOFF_DISABLE=1.

# Optional: per-bucket action policy when rubric.yaml drives the
# classification. Bucket names must match those declared in rubric.yaml.
# When a bucket is absent here OR mapped to null, that bucket is a no-op
# (no fire). When `decision: noop`, also a no-op. Otherwise emits
# according to decision + reason_template (same vars as on_fire).
on_bucket:
  critical-block:
    decision: block
    reason_template: |
      🔥 CRITICAL — context at {pct}% (ceiling at 90%). Handoff NOW.
      You may have only a few turns before /compact loses state.
      Bash(kaizen-handoff scaffold ...) → fill fields → auto-finalize.

  threshold-block:
    decision: block
    reason_template: |
      ⚠ MANDATORY pre-compact handoff (context {pct}%, threshold {threshold}%). Stop BLOCKED.
      kaizen-handoff scaffold → fill fields → auto-finalize.

  post-compact-warn:
    decision: systemMessage
    reason_template: |
      🟡 Post-compact session climbing (pct {pct}%, prior compact x{compact_count}).
      Consider pre-emptive handoff before next compact (each round loses more state).

  high-peak-soft-warn:
    decision: systemMessage
    reason_template: |
      🟡 High-churn session — peak {peak_pct}% reached even though current is {pct}%.
      Consider an early handoff to capture the dense work before another peak.

  noop: null
