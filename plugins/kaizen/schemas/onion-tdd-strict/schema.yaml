  feature: "chunked HTTP embedding pipeline + agentic RAG (works around nomic-v2's 512 ctx + Nemotron's quirks)"
  artifacts_produced:
    audit:          "(grep + cookbook research)"
    design_layers:  "Domain: chunk_tokens / mean_pool_l2 / extract_tool_calls / clean_chat_response / ModelCard. Application: LoadRows / TokenizeAndChunk / EmbedFanOut / Supervisor / MeanPoolAndPersist + DecideAction / RunSearch / RunReadFile. Infrastructure: UrllibPollingTransport / SqliteOnboardRepo. Presentation: CLI subcommands."
    red_test:       "test__chunking.py (34 tests) + test__model_cards.py (18 tests) — all initially failing"
    green_impl:     "_chunking.py (183 LOC) + _model_cards.py (153 LOC) — pure functions / frozen dataclasses"
    refactor:       "(folded into green-impl)"
    adapters:       "_adapters.py — HttpTransport / OnboardRepository protocols + impls; schema v2 migrator"
    composition:    "embed_chunked.py — PocketFlow Flow with 4 reindex nodes + 3 RAG nodes"
    supervisor:     "Supervisor node detects degenerate/partial rows; emits supervisor.report"
    trace_wire:     "emit_trace per node phase + per HTTP call + per RAG turn (llm-pipeline / llm-http / llm-chat / llm-embed / llm-rag)"
    structured_io:  "response_format=json_schema for Nemotron tool routing (vs prior <TOOLCALL> regex fallback) — 3.1s vs 13.5s end-to-end (4.3x speedup)"
    verify:         "52/52 tests pass; 1017-row reindex in 4.3s; agentic RAG in 3.1s; /kaizen:audit zero new HIGH findings"
